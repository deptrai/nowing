name: Backend Tests

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'nowing_backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.cache/uv
            nowing_backend/.venv
          key: python-deps-${{ hashFiles('nowing_backend/uv.lock') }}
          restore-keys: |
            python-deps-

      - name: Cache HuggingFace models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ env.EMBEDDING_MODEL }}

      - name: Install dependencies
        working-directory: nowing_backend
        run: uv sync

      - name: Run unit tests
        working-directory: nowing_backend
        run: uv run pytest -m unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nowing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nowing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.cache/uv
            nowing_backend/.venv
          key: python-deps-${{ hashFiles('nowing_backend/uv.lock') }}
          restore-keys: |
            python-deps-

      - name: Cache HuggingFace models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ env.EMBEDDING_MODEL }}

      - name: Install dependencies
        working-directory: nowing_backend
        run: uv sync

      - name: Run integration tests
        working-directory: nowing_backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nowing_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          ETL_SERVICE: DOCLING
        run: uv run pytest -m integration

  migration-downgrade-smoke:
    name: Migration Downgrade Smoke
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nowing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nowing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.cache/uv
            nowing_backend/.venv
          key: python-deps-${{ hashFiles('nowing_backend/uv.lock') }}
          restore-keys: |
            python-deps-

      - name: Alembic downgrade roundtrip (head → -1 → head)
        working-directory: nowing_backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nowing_test
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

  test-gate:
    name: Test Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, migration-downgrade-smoke]
    if: always()
    permissions: {}

    steps:
      - name: Check all test jobs
        env:
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
          MIGRATION_RESULT: ${{ needs.migration-downgrade-smoke.result }}
        run: |
          if [[ "$UNIT_TESTS_RESULT" == "failure" ||
                "$INTEGRATION_TESTS_RESULT" == "failure" ||
                "$MIGRATION_RESULT" == "failure" ]]; then
            echo "Backend tests failed"
            exit 1
          else
            echo "All backend tests passed"
          fi
