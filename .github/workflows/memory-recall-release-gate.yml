name: Memory Recall Release Gate (live)

# The real NFR-8 / RS-7 ship gate: seed the labeled corpus into a dedicated
# workspace on a live Nowing instance, measure recall, and block on the SM-10
# thresholds. Manual by design — it mutates a real tenant and needs credentials,
# so it must never fire automatically on a pull request.
#
# Before this can go green, gate.yaml needs `baseline_ratified: true` plus a
# baseline_source. That flip is only legitimate after the numbers come from a
# measured baseline on the real corpus (Story 3.9 §8: after 3.10b recovery and
# after story 8.7 freezes auto-extract) and the SM-10 metric owner signs off.
# Until then this job fails closed, which is the correct pre-baseline state.
#
# Use `purge: true` to delete the seeded fixtures afterwards. The eval workspace
# must be dedicated: off_corpus_rate counts anything the labels cannot judge, so
# a shared workspace will fail the gate.

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: 'Dedicated Nowing workspace id to seed and measure'
        required: true
        type: string
      backend_build_id:
        description: 'Deployed backend build/commit identifier this run evaluates'
        required: true
        type: string
      top_k:
        description: 'Recall window (RS-2 caps this at 5; must be 1-5)'
        required: false
        default: 5
        type: number
      purge:
        description: 'Delete the seeded fixture memories when finished'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.workspace_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Live memory recall measurement and ship gate
    runs-on: ubuntu-latest
    environment: memory-recall-eval
    env:
      NOWING_API_BASE: ${{ secrets.NOWING_API_BASE }}
      NOWING_JWT: ${{ secrets.NOWING_EVAL_JWT }}
      NOWING_EVAL_WORKSPACE_ID: ${{ inputs.workspace_id }}
    steps:
      - name: Validate backend_build_id is not blank
        run: |
          if [ -z "$(echo "${INPUTS_BACKEND_BUILD_ID}" | tr -d '[:space:]')" ]; then
            echo "::error::backend_build_id must not be blank"
            exit 1
          fi
        env:
          INPUTS_BACKEND_BUILD_ID: ${{ inputs.backend_build_id }}

      - name: Validate top_k range
        run: |
          top_k="${INPUTS_TOP_K}"
          if ! [[ "$top_k" =~ ^[0-9]+$ ]] || [ "$top_k" -lt 1 ] || [ "$top_k" -gt 5 ]; then
            echo "::error::top_k must be an integer between 1 and 5; got: $top_k"
            exit 1
          fi
        env:
          INPUTS_TOP_K: ${{ inputs.top_k }}

      # Isolated per run attempt so a re-run (or a concurrent dispatch, despite
      # the concurrency group above) can never read or upload another run's
      # artifacts. Exported via GITHUB_ENV rather than the job-level `env:`
      # block because the `runner` context isn't available there.
      - name: Compute isolated eval data dir
        run: |
          echo "EVAL_DATA_DIR=${RUNNER_TEMP}/nowing-eval-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Sync eval dependencies
        working-directory: nowing_evals
        run: uv sync --all-extras --frozen

      - name: Assert isolated eval data dir starts empty
        run: |
          if [ -e "$EVAL_DATA_DIR" ] && [ -n "$(ls -A "$EVAL_DATA_DIR" 2>/dev/null)" ]; then
            echo "::error::EVAL_DATA_DIR already exists and is not empty: $EVAL_DATA_DIR"
            exit 1
          fi

      - name: Verify backend_build_id against /health
        run: |
          api_base="${NOWING_API_BASE%/}"
          health_url="${api_base}/health"
          echo "Probing ${health_url} ..."
          live_build_id=$(curl -sS --max-time 30 --fail --retry 3 --retry-connrefused "$health_url" | python3 -c "import json,sys; print(json.load(sys.stdin).get('build_id',''))")
          if [ -z "$live_build_id" ]; then
            echo "::error::Could not read build_id from ${health_url}"
            exit 1
          fi
          echo "Live build_id: ${live_build_id}"
          expected_build_id="$(echo "${INPUTS_BACKEND_BUILD_ID}" | tr -d '[:space:]')"
          if [ "$live_build_id" != "$expected_build_id" ]; then
            echo "::error::Build ID mismatch: /health reports '${live_build_id}', expected '${expected_build_id}'"
            exit 1
          fi
        env:
          INPUTS_BACKEND_BUILD_ID: ${{ inputs.backend_build_id }}

      - name: Seed the labeled corpus
        working-directory: nowing_evals
        run: uv run --active python -m nowing_evals ingest memory recall

      - name: Measure recall
        working-directory: nowing_evals
        run: >-
          uv run --active python -m nowing_evals run memory recall
          --top-k "${INPUTS_TOP_K}"
          --backend-build-id "${INPUTS_BACKEND_BUILD_ID}"
        env:
          INPUTS_BACKEND_BUILD_ID: ${{ inputs.backend_build_id }}
          INPUTS_TOP_K: ${{ inputs.top_k }}

      - name: Ship gate
        working-directory: nowing_evals
        run: uv run --active python -m nowing_evals gate --suite memory --benchmark recall

      - name: Report
        if: always()
        working-directory: nowing_evals
        run: uv run --active python -m nowing_evals report --suite memory --benchmark recall

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: memory-recall-run-${{ inputs.workspace_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVAL_DATA_DIR }}/memory/runs/
          if-no-files-found: warn

      # Runs even when the gate fails: leaving fixture memories behind in a real
      # tenant is exactly the contamination the purge path exists to prevent.
      - name: Purge seeded fixtures
        if: always() && inputs.purge
        working-directory: nowing_evals
        run: uv run --active python -m nowing_evals purge --suite memory --benchmark recall
