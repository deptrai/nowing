name: Memory Recall Gate

# Story 3.9 (AC-7 / AR-8 / RS-7) — the ship-gate for memory recall quality.
#
# Two jobs, deliberately split by determinism:
#
# * `contract-and-thresholds` runs on every relevant PR. It needs no backend, no
#   database and no network, so it is safe to make required. It proves the gate
#   itself is sound: the metrics/oracle/dataset/gate unit suites pass, gate.yaml
#   carries concrete thresholds (no placeholder), and the MCP tool contract still
#   exposes `nowing_recall`. A recall gate is meaningless if the recalled tool is
#   not even registered, so the selfcheck failing fails this job (AR-8).
#
# * `live-gate` performs the actual measurement — ingest the labeled corpus into a
#   real workspace, run the benchmark, then `nowing_evals gate`, which exits
#   non-zero when precision@5 / noise miss the SM-10 thresholds (RS-7). It needs a
#   live Nowing instance, so it is opt-in (workflow_dispatch) rather than running
#   on every PR. This is the job that produces the ship baseline referenced by
#   story §8, and it must be green before the memory layer merges to production.
#
# Why the PR job does not invoke the gate CLI: with no baseline run artifact in
# the repo there is nothing to gate, and pointing the gate at a committed
# always-passing artifact would be a gate in name only.

on:
  pull_request:
    branches: [main, dev, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'nowing_evals/**'
      - 'nowing_mcp/**'
      - '.github/workflows/memory-recall-gate.yml'
  workflow_dispatch:
    inputs:
      run_live_gate:
        description: 'Run the live ingest + run + gate against a Nowing instance'
        type: boolean
        default: false
      sample_n:
        description: 'Limit the number of queries scored (blank = full dataset)'
        type: string
        default: ''
      provider_model:
        description: >-
          OpenRouter slug `setup` pins for the suite. Inert for this benchmark
          (recall is scored with no LLM in the loop) but `setup` requires it.
        type: string
        default: 'anthropic/claude-sonnet-4.5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-thresholds:
    name: Gate contract + MCP selfcheck
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: recall-gate-deps-${{ hashFiles('nowing_evals/uv.lock', 'nowing_mcp/uv.lock') }}
          restore-keys: |
            recall-gate-deps-

      - name: Install nowing_evals
        working-directory: nowing_evals
        run: uv sync --extra dev

      # AC-2 / AC-3 / AC-4 / AC-5 / AC-6: the gate's own machinery. No network.
      - name: Run memory-recall eval suites
        working-directory: nowing_evals
        run: |
          uv run pytest \
            tests/core/test_memory_recall_metrics.py \
            tests/core/test_metrics.py \
            tests/suites/test_memory_recall_dataset.py \
            tests/suites/test_memory_recall_suite.py \
            tests/suites/test_memory_recall_gate.py \
            tests/suites/test_memory_recall_selfcheck_ci.py \
            -q

      # AC-6 "cấm placeholder": fail loudly if the committed thresholds are not
      # concrete floats. Catches a merged `precision_at_5_min: null` immediately
      # rather than at the next live run.
      - name: Validate gate thresholds are concrete
        working-directory: nowing_evals
        run: |
          uv run python -c "
          from nowing_evals.core.gate import load_gate_thresholds
          t = load_gate_thresholds()
          assert isinstance(t.precision_at_5_min, float), t
          assert isinstance(t.noise_rate_max, float), t
          assert isinstance(t.min_similarity, float), t
          assert isinstance(t.top_k, int) and t.top_k <= 5, t
          print('gate thresholds OK:', t.to_dict())
          "

      - name: Verify memory/recall benchmark is registered
        working-directory: nowing_evals
        run: |
          uv run python -m nowing_evals suites list
          uv run python -m nowing_evals benchmarks list --suite memory

      - name: Install nowing_mcp
        working-directory: nowing_mcp
        run: uv sync --extra dev

      # AR-8: the MCP tool contract. Builds the server in-process — no live
      # backend required — and exits non-zero if `nowing_recall` went missing or
      # any tool/param lost its description.
      - name: MCP tool-contract selfcheck
        working-directory: nowing_mcp
        run: uv run python -m mcp_server.selfcheck

      - name: MCP memory-tools contract tests
        working-directory: nowing_mcp
        run: uv run pytest tests/test_memory_tools.py -q

  live-gate:
    name: Live recall gate (SM-10)
    runs-on: ubuntu-latest
    needs: contract-and-thresholds
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_gate
    environment: evals
    # Env var names are the ones core/config.py + core/auth.py actually read
    # (see nowing_evals/.env.example) — the harness has no NOWING_API_KEY.
    # Auth is one of two modes; supply EITHER NOWING_JWT (a PAT or operator
    # bearer token) OR the LOCAL email/password pair. Both are wired here so the
    # `evals` environment can pick whichever it holds; unset ones are empty and
    # ignored.
    env:
      NOWING_API_BASE: ${{ vars.NOWING_API_BASE }}
      NOWING_JWT: ${{ secrets.NOWING_JWT }}
      NOWING_REFRESH_TOKEN: ${{ secrets.NOWING_REFRESH_TOKEN }}
      NOWING_USER_EMAIL: ${{ secrets.NOWING_USER_EMAIL }}
      NOWING_USER_PASSWORD: ${{ secrets.NOWING_USER_PASSWORD }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install nowing_evals
        working-directory: nowing_evals
        run: uv sync --extra dev

      # `setup` pins the suite's search space (which the runner uses as the
      # workspace id) and requires an answer-LLM slug even though this benchmark
      # never calls one — recall is scored straight off /memories/search with no
      # LLM in the loop (story §9). The slug is therefore inert here; it only has
      # to be a valid registered OpenRouter config. Vision setup is skipped: the
      # corpus is plain text.
      - name: Set up eval suite
        working-directory: nowing_evals
        run: |
          uv run python -m nowing_evals setup \
            --suite memory \
            --provider-model "${{ inputs.provider_model }}" \
            --no-vision-llm-setup

      - name: Seed labeled memory corpus
        working-directory: nowing_evals
        run: uv run python -m nowing_evals ingest memory recall

      - name: Run recall benchmark
        working-directory: nowing_evals
        run: |
          if [ -n "${{ inputs.sample_n }}" ]; then
            uv run python -m nowing_evals run memory recall --n "${{ inputs.sample_n }}"
          else
            uv run python -m nowing_evals run memory recall
          fi

      # RS-7: non-zero exit here blocks the ship.
      - name: Enforce ship-gate thresholds
        working-directory: nowing_evals
        run: uv run python -m nowing_evals gate --suite memory --benchmark recall

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-recall-run
          path: nowing_evals/data/memory/runs/
          if-no-files-found: warn
