name: ChainLens Research Mutation Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  chainlens-research-mutation:
    name: Full Package Mutation Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # actions/cache saves the uv/venv cache
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Cache Python dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.cache/uv
            nowing_backend/.venv
          key: python-deps-${{ hashFiles('nowing_backend/uv.lock') }}
          restore-keys: |
            python-deps-

      - name: Install dependencies and cosmic-ray
        working-directory: nowing_backend
        run: |
          uv sync
          uv pip install cosmic-ray

      - name: Run full chainlens/research mutation gate
        working-directory: nowing_backend
        run: |
          uv run --no-sync cosmic-ray baseline mutation-nowing-chainlens-research-manual.toml
          uv run --no-sync cosmic-ray init mutation-nowing-chainlens-research-manual.toml /tmp/mutation-chainlens-research.sqlite
          uv run --no-sync cosmic-ray exec mutation-nowing-chainlens-research-manual.toml /tmp/mutation-chainlens-research.sqlite
          uv run --no-sync cr-rate --fail-over 20 /tmp/mutation-chainlens-research.sqlite

      - name: Save mutation report
        if: always()
        working-directory: nowing_backend
        run: |
          uv run --no-sync cr-report /tmp/mutation-chainlens-research.sqlite > /tmp/mutation-chainlens-research-report.txt || true

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: chainlens-research-mutation
          path: |
            /tmp/mutation-chainlens-research.sqlite
            /tmp/mutation-chainlens-research-report.txt
          retention-days: 14
