name: Story 24.3 Mutation Gate

on:
  pull_request:
    branches: [main, dev, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'nowing_backend/app/services/workspace_credit_service.py'
      - 'nowing_backend/app/services/lead_assignment_service.py'
      - 'nowing_backend/app/routes/lead_pipeline_routes.py'
      - 'nowing_backend/app/services/billing_event_service.py'
      - 'nowing_backend/app/capabilities/core/billing.py'
      - 'nowing_backend/tests/**'
      - 'scripts/mutation-gate.py'
      - '.github/workflows/mutation-gate-24.3.yml'
  push:
    branches: [main, dev, develop]
    paths:
      - 'nowing_backend/app/services/workspace_credit_service.py'
      - 'nowing_backend/app/services/lead_assignment_service.py'
      - 'nowing_backend/app/routes/lead_pipeline_routes.py'
      - 'nowing_backend/app/services/billing_event_service.py'
      - 'nowing_backend/app/capabilities/core/billing.py'
      - 'nowing_backend/tests/**'
      - 'scripts/mutation-gate.py'
      - '.github/workflows/mutation-gate-24.3.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  mutation-gate-24-3:
    name: Mutation gate 24.3 - ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # save uv cache and upload mutation artifacts
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        service:
          - workspace_credit_service
          - lead_assignment_service
          - billing_event_service
          - capabilities/core/billing
        include:
          - service: routes/lead_pipeline_routes
            test_files: tests/integration/routes/test_kanban_concurrency.py

    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nowing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nowing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nowing_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      ETL_SERVICE: DOCLING
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Cache Python dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.cache/uv
            nowing_backend/.venv
          key: python-deps-${{ hashFiles('nowing_backend/uv.lock') }}
          restore-keys: |
            python-deps-

      - name: Install dependencies
        working-directory: nowing_backend
        run: uv sync

      - name: Install cosmic-ray
        working-directory: nowing_backend
        run: uv pip install --python .venv/bin/python cosmic-ray

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set safe service name
        id: safe
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          SAFE_SERVICE=$(echo "$SERVICE" | tr '/' '-')
          echo "service=$SAFE_SERVICE" >> "$GITHUB_OUTPUT"

      - name: Run mutation gate
        env:
          SERVICE: ${{ matrix.service }}
          TEST_FILES: ${{ matrix.test_files }}
        run: |
          TEST_FILES_ARG=""
          if [ -n "$TEST_FILES" ]; then
            TEST_FILES_ARG="--test-files $TEST_FILES"
          fi
          python scripts/mutation-gate.py \
            --services "$SERVICE" \
            --timeout 120.0 \
            --project-root . \
            $TEST_FILES_ARG

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mutation-nowing-24-3-${{ steps.safe.outputs.service }}
          path: |
            _bmad-output/test-artifacts/mutation-nowing-${{ steps.safe.outputs.service }}*
            nowing_backend/mutation-nowing-${{ steps.safe.outputs.service }}*
          if-no-files-found: ignore
          retention-days: 14
