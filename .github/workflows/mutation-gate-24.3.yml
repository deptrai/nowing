name: Story 24.3 Mutation Gate

on:
  pull_request:
    branches: [main, dev, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'nowing_backend/app/services/workspace_credit_service.py'
      - 'nowing_backend/app/services/lead_assignment_service.py'
      - 'nowing_backend/app/routes/lead_pipeline_routes.py'
      - 'nowing_backend/app/services/billing_event_service.py'
      - 'nowing_backend/app/capabilities/core/billing.py'
      - 'nowing_backend/tests/**'
      - 'scripts/mutation-gate.py'
      - '.github/workflows/mutation-gate-24.3.yml'
  push:
    branches: [main, dev, develop]
    paths:
      - 'nowing_backend/app/services/workspace_credit_service.py'
      - 'nowing_backend/app/services/lead_assignment_service.py'
      - 'nowing_backend/app/routes/lead_pipeline_routes.py'
      - 'nowing_backend/app/services/billing_event_service.py'
      - 'nowing_backend/app/capabilities/core/billing.py'
      - 'nowing_backend/tests/**'
      - 'scripts/mutation-gate.py'
      - '.github/workflows/mutation-gate-24.3.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  mutation-gate-24-3:
    name: Mutation gate 24.3 - ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        service:
          - workspace_credit_service
          - lead_assignment_service
          - billing_event_service
          - capabilities/core/billing
        include:
          - service: routes/lead_pipeline_routes
            test_files: tests/integration/routes/test_kanban_concurrency.py

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nowing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nowing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nowing_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      ETL_SERVICE: DOCLING
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache Python dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            nowing_backend/.venv
          key: python-deps-${{ hashFiles('nowing_backend/uv.lock') }}
          restore-keys: |
            python-deps-

      - name: Install dependencies
        working-directory: nowing_backend
        run: uv sync

      - name: Install cosmic-ray
        working-directory: nowing_backend
        run: uv pip install --python .venv/bin/python cosmic-ray

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set safe service name
        id: safe
        run: |
          SAFE_SERVICE=$(echo '${{ matrix.service }}' | tr '/' '-')
          echo "service=$SAFE_SERVICE" >> "$GITHUB_OUTPUT"

      - name: Run mutation gate
        run: |
          TEST_FILES_ARG=""
          if [ -n "${{ matrix.test_files }}" ]; then
            TEST_FILES_ARG="--test-files ${{ matrix.test_files }}"
          fi
          python scripts/mutation-gate.py \
            --services ${{ matrix.service }} \
            --timeout 120.0 \
            --project-root . \
            $TEST_FILES_ARG

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-nowing-24-3-${{ steps.safe.outputs.service }}
          path: |
            _bmad-output/test-artifacts/mutation-nowing-${{ steps.safe.outputs.service }}*
            nowing_backend/mutation-nowing-${{ steps.safe.outputs.service }}*
          if-no-files-found: ignore
          retention-days: 14
