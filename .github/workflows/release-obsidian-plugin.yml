name: Release Obsidian Plugin

# Tag format: `obsidian-v<version>` and `<version>` must match `nowing_obsidian/manifest.json` exactly.
on:
  push:
    tags:
      - "obsidian-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases"
        required: true
        type: choice
        options:
          - never
          - always
        default: "never"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build and release Obsidian plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mirror manifest/versions and create GitHub release
    defaults:
      run:
        working-directory: nowing_obsidian

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # Need the checkout token for the manifest/versions.json mirror
          # commit and git push back to the default branch further down.
          # persist-credentials stays true on purpose for that push.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22.x
          # Release publishes runtime artifacts; do not read or write the
          # Actions dependency cache (cache-poisoning sink).
          package-manager-cache: false

      - name: Resolve plugin version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual runs derive the release version from manifest.json.
            version="$manifest_version"
            tag="obsidian-v$version"
          else
            tag="${GITHUB_REF_NAME}"
            if [ -z "$tag" ] || [[ "$tag" != obsidian-v* ]]; then
              echo "::error::Invalid tag '$tag'. Expected format: obsidian-v<version>"
              exit 1
            fi
            version="${tag#obsidian-v}"
            if [ "$version" != "$manifest_version" ]; then
              echo "::error::Tag version '$version' does not match manifest version '$manifest_version'"
              exit 1
            fi
          fi
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "version=$version"    >> "$GITHUB_OUTPUT"

      - name: Resolve publish mode
        id: release_mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "always" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Verify build artifacts
        run: |
          for f in main.js manifest.json styles.css; do
            test -f "$f" || (echo "::error::Missing release artifact: $f" && exit 1)
          done

      - name: Mirror manifest.json + versions.json to repo root
        if: steps.release_mode.outputs.should_publish == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          cp nowing_obsidian/manifest.json manifest.json
          cp nowing_obsidian/versions.json versions.json
          if git diff --quiet manifest.json versions.json; then
            echo "Root manifest/versions already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json versions.json
          git commit -m "chore(obsidian-plugin): mirror manifest+versions for ${STEPS_VERSION_OUTPUTS_TAG}"
          # Push to the default branch so Obsidian can fetch raw files from HEAD.
          if ! git push origin "HEAD:${GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH}"; then
            echo "::warning::Failed to push mirrored manifest/versions to default branch (likely branch protection). Continuing release."
          fi
        env:
          STEPS_VERSION_OUTPUTS_TAG: ${{ steps.version.outputs.tag }}
          GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      # Publish release under bare `manifest.json` version (no `obsidian-v` prefix) for BRAT/store compatibility.
      # `--latest=false` keeps the desktop app's `v*` release headlined since Obsidian and BRAT resolve plugins via getReleaseByTag, not the latest flag.
      # Re-runs update the existing release and overwrite the same assets, matching the previous action.
      - name: Create GitHub release
        if: steps.release_mode.outputs.should_publish == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}
        run: |
          title="Nowing Obsidian Plugin ${RELEASE_TAG}"
          assets=(
            nowing_obsidian/main.js
            nowing_obsidian/manifest.json
            nowing_obsidian/styles.css
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            notes="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body)"
            gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes"
            release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f make_latest=false >/dev/null
            gh release upload "$RELEASE_TAG" --clobber "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --title "$title" \
              --generate-notes \
              --latest=false \
              "${assets[@]}"
          fi
