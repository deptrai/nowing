name: Mutation Gate

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated service names (default: P0 services)'
        required: false
        default: 'pricing_registration,token_quota_service,token_tracking_service,provider_registry,model_resolver,auth,llm_service,llm_router_service,web_crawl_credit_service,platform_scrape_credit_service'
      timeout:
        description: 'Per-mutant timeout in seconds'
        required: false
        default: '120'
      test-files:
        description: 'Optional comma-separated focused test file paths (relative to nowing_backend)'
        required: false
        default: ''
      functions:
        description: 'Optional comma-separated function names to keep for this service (others skipped)'
        required: false
        default: ''
      skip-noise-operators:
        description: 'Skip BinaryOperator/UnaryOperator mutants (type-hint noise)'
        required: false
        default: 'false'
  schedule:
    # Weekly on Sundays at 04:00 UTC
    - cron: "0 4 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  split-services:
    name: Prepare service matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - name: Set service matrix
        id: set
        env:
          SERVICES: ${{ github.event.inputs.services || 'pricing_registration,token_quota_service,token_tracking_service,provider_registry,model_resolver,auth,llm_service,llm_router_service,web_crawl_credit_service,platform_scrape_credit_service' }}
        run: |
          JSON=$(echo "$SERVICES" | tr ',' '\n' | jq -R . | jq -s -c .)
          echo "services=$JSON" >> "$GITHUB_OUTPUT"

  mutation-gate:
    name: Mutation gate ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: split-services
    permissions:
      contents: read
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.split-services.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Cache Python dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.cache/uv
            nowing_backend/.venv
          key: python-deps-${{ hashFiles('nowing_backend/uv.lock') }}
          restore-keys: |
            python-deps-

      - name: Install dependencies
        working-directory: nowing_backend
        run: uv sync

      - name: Install cosmic-ray
        working-directory: nowing_backend
        run: uv pip install --python .venv/bin/python cosmic-ray

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set safe service name
        id: safe
        run: |
          SAFE_SERVICE=$(echo '${MATRIX_SERVICE}' | tr '/' '-')
          echo "service=$SAFE_SERVICE" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_SERVICE: ${{ matrix.service }}

      - name: Run mutation gate
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          SKIP_NOISE_OPERATORS: ${{ github.event.inputs.skip-noise-operators || 'false' }}
          MUTATION_TIMEOUT: ${{ github.event.inputs.timeout || '120' }}
          TEST_FILES: ${{ github.event.inputs.test-files || '' }}
          FUNCTIONS: ${{ github.event.inputs.functions || '' }}
        run: |
          SKIP_NOISE=""
          if [ "$SKIP_NOISE_OPERATORS" = "true" ]; then
            SKIP_NOISE="--skip-noise-operators"
          fi
          nowing_backend/.venv/bin/python scripts/mutation-gate.py \
            --services "$MATRIX_SERVICE" \
            --timeout "$MUTATION_TIMEOUT" \
            --project-root . \
            --test-files "$TEST_FILES" \
            --functions "$FUNCTIONS" \
            $SKIP_NOISE

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mutation-nowing-${{ steps.safe.outputs.service }}
          path: |
            _bmad-output/test-artifacts/mutation-nowing-${{ steps.safe.outputs.service }}*
            nowing_backend/mutation-nowing-${{ steps.safe.outputs.service }}*
          if-no-files-found: ignore
          retention-days: 14
