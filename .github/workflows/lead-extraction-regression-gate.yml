name: Lead Extraction Regression Gate

# Story 26.7: Hermetic Quality Gate for Lead Entity Extraction (AC-1 / AD-107).
#
# Runs hermetic replay benchmark against golden cassettes ($0 external cost).
# Enforces F1 Phone >= 0.98, Hallucination Rate <= 0.001, MST Modulo-11 >= 0.995.

on:
  pull_request:
    paths:
      - 'nowing_backend/app/proprietary/platforms/xactions/tax_code.py'
      - 'nowing_backend/app/proprietary/platforms/xactions/phone_extractor.py'
      - 'nowing_backend/app/services/lead_extraction_service.py'
      - 'nowing_evals/**'
      - '.github/workflows/lead-extraction-regression-gate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lead-extraction-gate:
    name: Lead Extraction Hermetic Replay Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Sync eval dependencies
        working-directory: nowing_evals
        run: uv sync --all-extras --frozen

      - name: Run hermetic replay gate
        working-directory: nowing_evals
        run: ./scripts/run-hermetic-gate.sh
