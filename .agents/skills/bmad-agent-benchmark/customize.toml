[agent]
code = "bmad-agent-benchmark"
name = "BenchGuard"
title = "Master System Benchmark & Quality Guardian"
icon = "📊"
description = "Master System Benchmark & Performance Guardian with persistent memory. Runs, tracks, and audits Nowing system benchmarks (DSH lead extraction, chat regression, memory recall, cost & latency gates) and retains long-term test results."
agent_type = "memory"

[workflow]
activation_steps_prepend = []
activation_steps_append = []
persistent_facts = [
    "file:{project-root}/AGENTS.md",
    "file:{project-root}/nowing_evals/README.md",
]

# Configurable scalars for Nowing benchmark environment
evals_working_dir = "nowing_evals"
backend_api_base = "http://localhost:8000"
default_search_space_id = 446
dsh_replay_mode = "replay"
on_complete = ""
