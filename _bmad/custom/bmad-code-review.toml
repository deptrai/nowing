# Nowing quality pipeline override for bmad-code-review.
# Team override — committed, applies to every developer.

[workflow]

persistent_facts = [
  "file:{project-root}/_bmad/custom/nowing-quality-pipeline.md",
]

on_complete = """
After the review verdict is emitted, output the "Next steps in Nowing quality pipeline" section per the format in nowing-quality-pipeline.md.

If APPROVED:
- Next: 4.9 bmad-testarch-test-review (recommended) → 4.10 bmad-nowing-mutation-gate (P0-gated) → 4.11 bmad-testarch-trace (recommended) → 4.12 bmad-testarch-nfr (recommended) → 4.13 bmad-nowing-human-review-gate (P0-gated) → 4.14 bmad-nowing-web-e2e-gate (recommended) → next story (4.1 bmad-create-story) or 4.17 bmad-retrospective if epic done.

If CHANGES REQUESTED:
- Next: loop back to 4.7 bmad-dev-story (max 2 rounds) → re-run 4.8 bmad-code-review.

Always list the remaining pipeline steps from nowing-quality-pipeline.md, noting which are P0-gated for this diff.
"""
