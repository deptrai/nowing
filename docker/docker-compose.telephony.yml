# =============================================================================
# Nowing Telephony & Voice AI Infrastructure Stack
# Story 38.1 / Invariant AD-122: Kamailio SBC Edge & LiveKit SIP Gateway Cluster
# Direct host/internal RTP routing (10000-20000/UDP), no Caddy/Traefik reverse proxy.
# =============================================================================

name: nowing-telephony

x-livekit-sip-common: &livekit-sip-common
  image: livekit/sip:v1.15.0   # pinned — do not use :latest in production
  restart: unless-stopped
  sysctls:
    # Raise UDP socket buffers to prevent RTP packet loss under concurrent calls
    - net.core.rmem_max=16777216   # 16 MB
    - net.core.wmem_max=16777216   # 16 MB
    - net.core.netdev_max_backlog=5000
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8081/"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 15s
  environment:
    - LIVEKIT_URL=${LIVEKIT_URL:-http://livekit:7880}
    - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
    - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
    - REDIS_HOST=${REDIS_HOST:-redis}
    - REDIS_PORT=${REDIS_PORT:-6379}
    - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Set SIP_GATEWAY_PUBLIC_IP to the host's routable/public IP before
    # deploying to production — required for carrier RTP reachability.
    - SIP_GATEWAY_PUBLIC_IP=${SIP_GATEWAY_PUBLIC_IP:-}
    - SIP_USE_EXTERNAL_IP=${SIP_USE_EXTERNAL_IP:-false}
    - SIP_MEDIA_PUBLIC_IP=${SIP_MEDIA_PUBLIC_IP:-}
    - SIP_MEDIA_USE_EXTERNAL_IP=${SIP_MEDIA_USE_EXTERNAL_IP:-false}
    - SIP_LOCAL_NET=${SIP_LOCAL_NET:-}
  networks:
    telephony_net: {}
    dokploy-network: {}

services:
  kamailio:
    image: kamailio/kamailio:5.8.3   # pinned
    container_name: nowing-kamailio
    restart: unless-stopped
    sysctls:
      - net.core.rmem_max=16777216
      - net.core.wmem_max=16777216
      - net.core.netdev_max_backlog=5000
    healthcheck:
      # Kamailio exposes no HTTP health endpoint; use SIP OPTIONS ping
      test: ["CMD-SHELL", "kamctl ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro
    environment:
      - SIP_PORT=5060
      - KAMAILIO_LOG_LEVEL=2
    networks:
      - telephony_net
    depends_on:
      livekit-sip-1:
        condition: service_healthy
      livekit-sip-2:
        condition: service_healthy

  livekit-sip-1:
    <<: *livekit-sip-common
    container_name: nowing-livekit-sip-1
    volumes:
      - ./livekit/sip-1.yaml:/etc/livekit/sip.yaml:ro
    environment:
      - SIP_CONFIG_FILE=/etc/livekit/sip.yaml
      - LIVEKIT_URL=${LIVEKIT_URL:-http://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SIP_GATEWAY_PUBLIC_IP=${SIP_GATEWAY_PUBLIC_IP:-}
      - SIP_USE_EXTERNAL_IP=${SIP_USE_EXTERNAL_IP:-false}
      - SIP_MEDIA_PUBLIC_IP=${SIP_MEDIA_PUBLIC_IP:-}
      - SIP_MEDIA_USE_EXTERNAL_IP=${SIP_MEDIA_USE_EXTERNAL_IP:-false}
      - SIP_LOCAL_NET=${SIP_LOCAL_NET:-}
      - SIP_GATEWAY_HOST=livekit-sip-1
    ports:
      - "10000-15000:10000-15000/udp"
    networks:
      telephony_net:
        aliases:
          - livekit-sip-1
      dokploy-network: {}

  livekit-sip-2:
    <<: *livekit-sip-common
    container_name: nowing-livekit-sip-2
    volumes:
      - ./livekit/sip-2.yaml:/etc/livekit/sip.yaml:ro
    environment:
      - SIP_CONFIG_FILE=/etc/livekit/sip.yaml
      - LIVEKIT_URL=${LIVEKIT_URL:-http://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SIP_GATEWAY_PUBLIC_IP=${SIP_GATEWAY_PUBLIC_IP:-}
      - SIP_USE_EXTERNAL_IP=${SIP_USE_EXTERNAL_IP:-false}
      - SIP_MEDIA_PUBLIC_IP=${SIP_MEDIA_PUBLIC_IP:-}
      - SIP_MEDIA_USE_EXTERNAL_IP=${SIP_MEDIA_USE_EXTERNAL_IP:-false}
      - SIP_LOCAL_NET=${SIP_LOCAL_NET:-}
      - SIP_GATEWAY_HOST=livekit-sip-2
    ports:
      - "15001-20000:15001-20000/udp"
    networks:
      telephony_net:
        aliases:
          - livekit-sip-2
      dokploy-network: {}

networks:
  telephony_net:
    name: nowing_telephony_net
    driver: bridge
  # Join dokploy-network so LiveKit SIP can resolve redis:6379 and livekit:7880
  dokploy-network:
    external: true
