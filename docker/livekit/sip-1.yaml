# =============================================================================
# LiveKit SIP Gateway — Instance 1
# Story 38.1 / Invariant AD-122
# Bridges domestic SIP Trunks (G.711a PCMA 8kHz) with LiveKit WebRTC SFU (Opus 48kHz).
# Schema: github.com/livekit/sip/pkg/config/config.go (v1.15.x)
# =============================================================================

# LiveKit Server Authentication & Signaling (env-injected at runtime)
api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}
ws_url: ${LIVEKIT_URL}

# Internal Redis Coordination (required — PSRPC message bus)
redis:
  address: ${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: 0

# SIP Signaling Network
sip_port: 5060
sip_port_listen: 5060
sip_hostname: ${SIP_GATEWAY_HOST}

# Cluster identity (shared by both instances so LiveKit treats them as one pool)
cluster_id: "nowing-sip"

# RTP Audio Stream Port Range — instance 1 owns 10000-15000
# Must not overlap with sip-2 range (15001-20000) to prevent port collision.
rtp_port:
  start: 10000
  end: 15000

# Codec allowlist — keys of official `codecs` map (map[string]bool)
# G.711 A-law (PCMA 8kHz) for carrier trunks, Opus 48kHz for WebRTC SFU.
# All other codecs (G.729, G.722, AMR, Speex) are rejected at SDP negotiation.
codecs:
  pcma: true   # G.711 A-law 8kHz — domestic carrier trunk standard
  opus: true   # WebRTC Opus 48kHz — LiveKit SFU internal

# NAT / Docker bridge traversal
# Advertise host-reachable IP in SIP Via/Contact and SDP c= lines.
# SIP_GATEWAY_PUBLIC_IP should be set to the Docker host's routable address
# (e.g. the dokploy server public IP or the host's LAN IP for internal trunks).
# Falls back to container bridge IP if unset (dev mode only — media will fail
# for external carriers; set the env var before deploying to production).
nat_1_to_1_ip: ${SIP_GATEWAY_PUBLIC_IP:-}
use_external_ip: ${SIP_USE_EXTERNAL_IP:-false}
# Separate media NAT IP if signaling and RTP advertise different addresses.
media_nat_1_to_1_ip: ${SIP_MEDIA_PUBLIC_IP:-}
media_use_external_ip: ${SIP_MEDIA_USE_EXTERNAL_IP:-false}
# Local subnet hint — restricts local IP selection to Docker bridge range.
local_net: ${SIP_LOCAL_NET:-}

# RTP port reuse guard: hold recently-closed ports to drain stale packets.
rtp_draining_idle_timeout: 30s
rtp_draining_duration: 10m

# Media watchdog
media_timeout: 60s
media_timeout_initial: 5s

# Jitter buffer for inbound RTP (carrier audio into LiveKit)
enable_jitter_buffer: true

# Call admission limits
max_active_calls: 100
max_cpu_utilization: 0.9

# Hide SIP endpoint from unauthenticated probes (silently drop bad INVITEs)
hide_inbound_port: true

# Symmetric RTP — required when behind Docker NAT so audio flows both ways
symmetric_rtp: true

# Monitoring & Logging
logging:
  level: info
health_port: 8081
prometheus_port: 8082
