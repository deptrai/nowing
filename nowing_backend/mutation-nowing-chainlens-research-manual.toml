[cosmic-ray]
module-path = "app/capabilities/chainlens/research"
timeout = 60.0
excluded-modules = ["tests", "migrations", "proprietary"]
test-command = 'bash -c "COSMIC_RAY=1 .venv/bin/python -m pytest tests/unit/capabilities/chainlens/research/test_mutation_killers.py tests/unit/capabilities/chainlens/research/test_mutation_killers_extra.py tests/unit/capabilities/chainlens/research/test_schemas.py tests/unit/capabilities/chainlens/research/test_executor.py tests/unit/capabilities/chainlens/research/test_degradation.py tests/unit/capabilities/chainlens/research/test_chainlens_fixture_drift.py tests/unit/capabilities/chainlens/test_registry.py tests/unit/capabilities/test_billing.py tests/unit/observability/test_chainlens_degradation.py tests/unit/agents/chat/multi_agent_chat/subagents/builtins/chainlens/test_system_prompt.py tests/unit/automations/dispatch/test_research_thread_coerce.py tests/unit/capabilities/access/test_agent_degraded.py tests/unit/capabilities/access/test_rest_degraded.py -m \"unit or not integration\" -x 2>&1"'

[cosmic-ray.distributor]
name = "local"
