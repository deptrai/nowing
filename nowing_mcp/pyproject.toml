[project]
name = "nowing-mcp"
version = "0.1.0"
description = "MCP server exposing Nowing scrapers, knowledge base, and workspace tools over the REST API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.26.0,<2",
    "httpx>=0.27.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
nowing-mcp = "mcp_server.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
