      max_p95_e2e_ms: 60000
      max_p95_cost_micros: 200000
    auto:
      max_p95_e2e_ms: 30000
      max_p95_cost_micros: 100000
  per_tier:
    short:
      max_p95_e2e_ms: 15000
    long_context:
      max_p95_e2e_ms: 45000
    multi_tool:
      max_p95_e2e_ms: 60000
